# created-by: snowflake-apps-create; template=nextjs-template; skill-version=1.0.0
version: 2

name: AGENT_OBSERVABILITY
database: AGENT_OBS_APPS
schema: PUBLIC
query_warehouse: AGENT_OBS_APP_WH
# name, database, schema, query_warehouse and auto_suspend_secs are set from
# install.conf by ../deploy.sh --app at deploy time; these are the defaults.
auto_suspend_secs: 3600

label: "Agent Observability"
description: "Cross-agent observability for Cortex Agents and Snowflake CoWork: usage, cost, quality, config and trace drill-down."
icon: public/icon.svg

runtime: node

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - output
  - app.yml.builder
